name: Build Subnautica Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Mod
      run: dotnet build --configuration Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SubnauticaKnuckles
        path: |
          bin/Release/net472/SubnauticaKnuckles.dll
          bin/Release/net472/Assets/**
